<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XiliX OS</title>
<link rel="stylesheet" href="https://unpkg.com/98.css">
<link rel="stylesheet" href="style.css">
</head>
<body>

<!-- Boot screen -->
<div id="boot">Booting XiliX OS...</div>

<!-- Desktop -->
<div id="desktop">
  <!-- Desktop icons -->
  <div class="icon" style="top:20px; left:20px;" onclick="OS.openApp('explorer')">
    <img src="icons/explorer.png"><span>Explorer</span>
  </div>
  <div class="icon" style="top:120px; left:20px;" onclick="OS.openApp('notes')">
    <img src="icons/notes.png"><span>Notes</span>
  </div>
  <div class="icon" style="top:220px; left:20px;" onclick="OS.openApp('terminal')">
    <img src="icons/terminal.png"><span>Terminal</span>
  </div>
  <div class="icon" style="top:320px; left:20px;" onclick="OS.openApp('trash')">
    <img src="icons/trash.png"><span>Trash</span>
  </div>
  <div class="icon" style="top:420px; left:20px;" onclick="OS.openApp('settings')">
    <img src="icons/settings.png"><span>Settings</span>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button class="start-btn" onclick="OS.toggleStart()">Start</button>
    <div id="taskbar-apps"></div>
    <div id="taskbar-clock"></div>
  </div>

  <!-- Start Menu -->
  <div id="start-menu">
    <button onclick="OS.openApp('explorer')">File Explorer</button>
    <button onclick="OS.openApp('notes')">Notes</button>
    <button onclick="OS.openApp('terminal')">Terminal</button>
    <button onclick="OS.openApp('trash')">Trash</button>
    <button onclick="OS.openApp('settings')">Settings</button>
    <button onclick="alert('XiliX OS v0.2')">About</button>
  </div>
</div>

<script src="main.js"></script>
<script src="apps/explorer.js"></script>
<script src="apps/notes.js"></script>
<script src="apps/terminal.js"></script>
<script src="apps/trash.js"></script>
<script src="apps/settings.js"></script>
</body>
</html>
