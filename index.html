<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>XiliX OS</title>
<link rel="stylesheet" href="https://unpkg.com/98.css">
<style>
  body {
    margin: 0; height: 100vh; overflow: hidden;
    font-family: "MS Sans Serif", sans-serif;
  }
  #boot {
    background: black; color: white; display:flex; align-items:center; justify-content:center;
    height: 100vh; font-size: 24px;
  }
  #desktop {
    display: none; position: relative; width: 100%; height: 100%;
    background: teal; overflow: hidden;
  }
  .icon {
    width: 80px; text-align: center; color: white; cursor: pointer; position: absolute;
  }
  .icon img { width: 32px; height: 32px; display:block; margin:0 auto 4px; }
  .window {
    position: absolute; min-width: 250px; min-height: 150px;
    background: silver; border: 2px solid black;
    display: none; z-index: 10;
  }
  .title-bar { display:flex; justify-content:space-between; cursor:move; }
  .window-body { padding: 5px; background: #C0C0C0; height: calc(100% - 26px); overflow:auto; }
  .taskbar {
    position:absolute; bottom:0; left:0; right:0; height:40px;
    background:silver; display:flex; align-items:center; border-top:2px solid white; padding:2px;
  }
  .start-btn { margin-right:8px; }
  #start-menu {
    position:absolute; bottom:40px; left:0; background:silver; border:2px solid black;
    display:none; flex-direction:column; width:200px;
  }
  #start-menu button { text-align:left; width:100%; }
  .taskbar-app {
    margin-right: 4px; padding: 2px 6px; background: #d0d0d0; border: 1px solid black;
    cursor: pointer;
  }
</style>
</head>
<body>

<!-- Boot screen -->
<div id="boot">Booting XiliX OS...</div>

<!-- Desktop -->
<div id="desktop">
  <!-- Icons -->
  <div class="icon" style="top:20px; left:20px;" onclick="openApp('explorer')">
    <img src="https://icons.iconarchive.com/icons/papirus-team/papirus-apps/32/system-file-manager-icon.png"><span>Explorer</span>
  </div>
  <div class="icon" style="top:120px; left:20px;" onclick="openApp('notes')">
    <img src="https://icons.iconarchive.com/icons/papirus-team/papirus-mimetypes/32/text-x-generic-icon.png"><span>Notes</span>
  </div>
  <div class="icon" style="top:220px; left:20px;" onclick="openApp('terminal')">
    <img src="https://icons.iconarchive.com/icons/papirus-team/papirus-apps/32/utilities-terminal-icon.png"><span>Terminal</span>
  </div>
  <div class="icon" style="top:320px; left:20px;" onclick="openApp('trash')">
    <img src="https://icons.iconarchive.com/icons/papirus-team/papirus-places/32/user-trash-icon.png"><span>Trash</span>
  </div>

  <!-- Windows -->
  <div class="window" id="explorer" style="top:100px; left:100px; width:350px; height:250px;">
    <div class="title-bar" onmousedown="startDrag(event,'explorer')">
      <div class="title-bar-text">File Explorer</div>
      <div class="title-bar-controls">
        <button onclick="closeApp('explorer')"></button>
      </div>
    </div>
    <div class="window-body">
      <button onclick="createFile()">New File</button>
      <ul id="file-list"></ul>
    </div>
  </div>

  <div class="window" id="notes" style="top:150px; left:150px; width:300px; height:250px;">
    <div class="title-bar" onmousedown="startDrag(event,'notes')">
      <div class="title-bar-text">Notes</div>
      <div class="title-bar-controls">
        <button onclick="closeApp('notes')"></button>
      </div>
    </div>
    <div class="window-body">
      <textarea id="note-text" rows="10"></textarea>
      <button onclick="saveNotes()">Save</button>
    </div>
  </div>

  <div class="window" id="terminal" style="top:200px; left:200px; width:400px; height:250px;">
    <div class="title-bar" onmousedown="startDrag(event,'terminal')">
      <div class="title-bar-text">Terminal</div>
      <div class="title-bar-controls">
        <button onclick="closeApp('terminal')"></button>
      </div>
    </div>
    <div class="window-body">
      <div id="terminal-output" style="background:black; color:lime; height:150px; overflow:auto; font-family:monospace; padding:4px;"></div>
      <input id="terminal-input" onkeydown="if(event.key==='Enter'){runCommand(this.value);this.value='';}">
    </div>
  </div>

  <div class="window" id="trash" style="top:250px; left:250px; width:300px; height:200px;">
    <div class="title-bar" onmousedown="startDrag(event,'trash')">
      <div class="title-bar-text">Trash</div>
      <div class="title-bar-controls">
        <button onclick="closeApp('trash')"></button>
      </div>
    </div>
    <div class="window-body">
      <ul id="trash-list"></ul>
    </div>
  </div>

  <!-- Taskbar -->
  <div class="taskbar">
    <button class="start-btn" onclick="toggleStart()">Start</button>
    <div id="taskbar-apps"></div>
  </div>

  <!-- Start menu -->
  <div id="start-menu">
    <button onclick="openApp('explorer')">File Explorer</button>
    <button onclick="openApp('notes')">Notes</button>
    <button onclick="openApp('terminal')">Terminal</button>
    <button onclick="openApp('trash')">Trash</button>
    <button onclick="alert('XiliX OS v0.1')">About</button>
  </div>
</div>

<script>
let zIndexCounter=10;

// Boot screen
setTimeout(()=>{
  document.getElementById('boot').style.display='none';
  document.getElementById('desktop').style.display='block';
  refreshFiles(); refreshTrash();
  document.getElementById('note-text').value = localStorage.getItem('notes')||'';
},2000);

// Window handling
function openApp(id){
  const win=document.getElementById(id);
  win.style.display='block';
  win.style.zIndex=++zIndexCounter;
  addTaskbar(id);
  if(id==='explorer'){refreshFiles();}
  if(id==='trash'){refreshTrash();}
}
function closeApp(id){
  document.getElementById(id).style.display='none';
  removeTaskbar(id);
}
function startDrag(e,id){
  const win=document.getElementById(id);
  let offsetX=e.clientX-win.offsetLeft, offsetY=e.clientY-win.offsetTop;
  function drag(ev){
    win.style.left=(ev.clientX-offsetX)+'px';
    win.style.top=(ev.clientY-offsetY)+'px';
    win.style.zIndex=++zIndexCounter;
  }
  document.onmousemove=drag;
  document.onmouseup=()=>{document.onmousemove=null;};
}

// Taskbar management
function addTaskbar(id){
  if(document.getElementById('tb-'+id)) return;
  const btn=document.createElement('div');
  btn.id='tb-'+id; btn.className='taskbar-app';
  btn.textContent=document.querySelector('#'+id+' .title-bar-text').textContent;
  btn.onclick=()=>openApp(id);
  document.getElementById('taskbar-apps').appendChild(btn);
}
function removeTaskbar(id){
  const btn=document.getElementById('tb-'+id);
  if(btn) btn.remove();
}

// Start menu
function toggleStart(){
  const menu=document.getElementById('start-menu');
  menu.style.display=(menu.style.display==='flex'?'none':'flex');
}

// File system
function createFile(){
  let files=JSON.parse(localStorage.getItem('files')||'[]');
  const name=prompt("File name:");
  if(name) files.push({name,content:""});
  localStorage.setItem('files',JSON.stringify(files));
  refreshFiles();
}
function refreshFiles(){
  const list=document.getElementById('file-list');
  if(!list) return;
  list.innerHTML='';
  const files=JSON.parse(localStorage.getItem('files')||'[]');
  files.forEach((f,i)=>{
    const li=document.createElement('li');
    li.textContent=f.name;
    li.onclick=()=>{
      const newContent=prompt("Edit file:",f.content);
      if(newContent!==null){f.content=newContent; files[i]=f;
        localStorage.setItem('files',JSON.stringify(files)); refreshFiles();}
    };
    li.oncontextmenu=(ev)=>{ev.preventDefault(); deleteFile(i);};
    list.appendChild(li);
  });
}
function deleteFile(i){
  let files=JSON.parse(localStorage.getItem('files')||'[]');
  let trash=JSON.parse(localStorage.getItem('trash')||'[]');
  trash.push(files[i]); files.splice(i,1);
  localStorage.setItem('files',JSON.stringify(files));
  localStorage.setItem('trash',JSON.stringify(trash));
  refreshFiles(); refreshTrash();
}
function refreshTrash(){
  const list=document.getElementById('trash-list'); if(!list) return;
  list.innerHTML='';
  const trash=JSON.parse(localStorage.getItem('trash')||'[]');
  trash.forEach((f,i)=>{
    const li=document.createElement('li');
    li.textContent=f.name;
    li.onclick=()=>{
      let files=JSON.parse(localStorage.getItem('files')||'[]');
      files.push(f); trash.splice(i,1);
      localStorage.setItem('files',JSON.stringify(files));
      localStorage.setItem('trash',JSON.stringify(trash));
      refreshFiles(); refreshTrash();
    };
    li.oncontextmenu=(ev)=>{ev.preventDefault(); trash.splice(i,1);
      localStorage.setItem('trash',JSON.stringify(trash)); refreshTrash();};
    list.appendChild(li);
  });
}

// Notes
function saveNotes(){
  localStorage.setItem('notes',document.getElementById('note-text').value);
  alert("Notes saved!");
}

// Terminal
function runCommand(cmd){
  const out=document.getElementById('terminal-output');
  let result="";
  if(cmd==="help"){result="Commands: help, echo [msg], files, clear";}
  else if(cmd.startsWith("echo ")){result=cmd.slice(5);}
  else if(cmd==="files"){
    const files=JSON.parse(localStorage.getItem('files')||'[]');
    result="Files:\n"+files.map(f=>f.name).join("\n");
  }
  else if(cmd==="clear"){out.textContent=""; return;}
  else{result="Unknown command";}
  out.textContent+="> "+cmd+"\n"+result+"\n";
  out.scrollTop=out.scrollHeight;
}
</script>
</body>
</html>
